/* ফাঁকা বা অর্থহীন লেখা ধরা (aaaaaa, 123123 ইত্যাদি) */
function junk(s){
  s=String(s||'').trim();if(!s)return false;
  if(/(.)\1{5,}/u.test(s))return true;
  if(s.length>=20&&new Set([...s.replace(/\s/g,'')]).size<7)return true;
  if(/^[\d\s\p{P}\p{S}]+$/u.test(s))return true;
  return false;
}

/* অ্যাডমিন: আবেদনের মান স্কোর (০–১০০) */
function qScore(a){
  const L=s=>String(s||'').trim().length;
  let s=Math.min(L(a.appPurpose)/300,1)*35+Math.min(L(a.targetUsers)/150,1)*20;
  s+=[a.feature1,a.feature2,a.feature3].reduce((t,x)=>t+Math.min(L(x)/80,1),0)/3*30;
  if(a.fbLink)s+=5;
  if(![a.appPurpose,a.targetUsers,a.feature1,a.feature2,a.feature3].some(junk))s+=10;
  return Math.round(s);
}

function chartHtml(){

  for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);days.push({k:d.toDateString(),l:d.toLocaleDateString('bn-BD',{day:'numeric'}),n:0})}

}

function waLink(num,name){
  let d=String(num||'').replace(/\D/g,'');if(!d)return '';
  if(d.startsWith('01'))d='88'+d;
  const t=encodeURIComponent(`আসসালামু আলাইকুম ${name||''}, HafijulNovaLabs-এর ফ্রি অ্যাপ অফার নিয়ে যোগাযোগ করছি।`);
  return `https://wa.me/${d}?text=${t}`;
}
/* বাছাইয়ের সময় নাম ঘোরার অ্যানিমেশন */
function spin(names){
  return new Promise(res=>{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches||!names.length){res();return}
    const o=document.createElement('div');o.className='spin';o.innerHTML='<div><small>র‍্যান্ডম বাছাই চলছে…</small><b id="spN"></b></div>';
    document.body.appendChild(o);const el=$('#spN',o);
    const iv=setInterval(()=>{el.textContent=names[Math.floor(Math.random()*names.length)]},70);
    setTimeout(()=>{clearInterval(iv);o.remove();res()},2800);
  });
}

async function loadOffers(){
  const s=await getDocs(query(collection(db,'offers'),orderBy('createdAt','desc')));
  adm.offers=s.docs.map(d=>({id:d.id,...d.data()}));
  if(!adm.cur||!adm.offers.find(o=>o.id===adm.cur)) adm.cur=(adm.offers.find(o=>o.status==='open')||adm.offers[0]||{}).id||null;
}
async function loadApps(){
  if(!adm.cur){adm.apps=[];return}
  const s=await getDocs(collection(db,'offers',adm.cur,'applications'));
  adm.apps=s.docs.map(d=>({id:d.id,...d.data()}));
  adm.meta={};
  try{
    const ps=await getDocs(collection(db,'offers',adm.cur,'private'));
    const notes={};
    ps.docs.forEach(d=>{if(d.id==='meta')adm.meta=d.data();else if(d.id.startsWith('n_'))notes[d.id.slice(2)]=d.data()});
    adm.apps.forEach(a=>{const n=notes[a.id];if(n){a.tag=n.tag||'';a.adminNote=n.adminNote||''}});
  }catch{toast('অ্যাডমিন-ওনলি ডেটা লোড হয়নি: নতুন রুলস পাবলিশ করেছেন কি?')}

const SHOW_KEYS=[['applied','মোট আবেদন'],['selected','নির্বাচিত'],['delivered','ডেলিভারি হওয়া অ্যাপ'],['inProgress','এখন কাজ চলছে']];
function calcStats(){
  const A=adm.apps,S=A.filter(a=>a.selected);
  return {applied:A.length,selected:S.length,delivered:S.filter(a=>a.workStatus==='delivered').length,inProgress:S.filter(a=>a.workStatus==='in_progress').length};
}
async function syncStats(force){
  const o=curOffer();if(!o)return false;
  const c=calcStats(),old=o.stats||{},first=typeof old.showStats!=='boolean';
  if(!force&&!first&&Object.keys(c).every(k=>old[k]===c[k]))return false;
  const upd={};
  Object.entries(c).forEach(([k,n])=>{upd['stats.'+k]=n});
  if(first){upd['stats.showStats']=true;SHOW_KEYS.forEach(([k])=>{upd['stats.show.'+k]=true})}
  try{
    await updateDoc(doc(db,'offers',o.id),upd);
    o.stats={...old,...c,...(first?{showStats:true,show:{applied:true,selected:true,delivered:true,inProgress:true}}:{})};
    return true;
  }catch{return false}
}

    try{

function dl(a){

  return `<div class="info"><dl>${rows([['Gmail',a.email],['অ্যাপের নাম',a.appName],['কী করবে',a.appPurpose],['ফিচার ১',a.feature1],['ফিচার ২',a.feature2],['ফিচার ৩',a.feature3],['কার জন্য',a.targetUsers],['ধরন',a.appType+(a.appTypeOther?' — '+a.appTypeOther:'')],['ইন্টারনেট',a.needsInternet],['কার জন্য ব্যবহার',a.usedFor],['ফেসবুক',a.fbLink]])}</dl>

  ${s2.logoUrl?`<div style="margin-top:10px"><a href="${esc(s2.logoUrl)}" target="_blank" rel="noopener"><img src="${esc(s2.logoUrl)}" alt="লোগো" style="width:76px;height:76px;border-radius:20px;object-fit:contain;background:#eee"></a></div>`:''}
  ${(s2.shots||[]).length?`<div class="shots">${s2.shots.map(u=>`<a class="shot" href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join('')}</div>`:''}<button class="btn sm ghost" data-copy="${a.id}">তথ্য কপি করুন</button>`:''}</div>`;
}
const TAGS=['গুরুত্বপূর্ণ','পরে দেখব','সমস্যা','ভালো আইডিয়া'];
const bkSel=new Set();
function paneApps(o){
  const p=$('#pane');
  if(!o){p.innerHTML='<div class="card">আগে অফার বানান।</div>';return}
  const stOpts=Object.entries(STATUS).filter(([k])=>k!=='applied').map(([k,t])=>`<option value="${k}">${t}</option>`).join('');
  p.innerHTML=`${chartHtml()}<div class="card"><div class="row"><input type="text" id="q" class="grow" placeholder="নাম, Gmail বা অ্যাপের নামে খুঁজুন">
  <select id="flt"><option value="all">সব</option><option value="sel">নির্বাচিত</option><option value="wait">অপেক্ষমাণ</option><option value="rest">বাকিরা</option>${Object.entries(STATUS).filter(([k])=>k!=='applied').map(([k,t])=>`<option value="s:${k}">${t}</option>`).join('')}</select>
  <select id="tagf"><option value="">সব ট্যাগ</option>${TAGS.map(t=>`<option>${t}</option>`).join('')}</select>
  <button class="btn sm ghost" id="csv">CSV</button><button class="btn sm ghost" id="bk">JSON ব্যাকআপ</button></div>
  <div class="row" style="margin-top:10px"><select id="bst">${stOpts}</select><button class="btn sm gold" id="bapply">টিক দেওয়াদের স্ট্যাটাস বদলান</button><button class="btn sm ghost" id="ball">নির্বাচিত সবাইকে বাছুন</button></div></div><div id="list"></div>`;
  const row=a=>{
    const wa=waLink(a.step2?.whatsapp,a.name);
    return `<div class="arow">${a.selected?`<input type="checkbox" class="bkc" data-bk="${a.id}" aria-label="বাছুন" ${bkSel.has(a.id)?'checked':''}>`:'<span></span>'}<details><summary><span><b>${esc(a.name||a.email)}</b> — ${esc(a.appName)}</span><span>${a.tag?`<span class="pill">${esc(a.tag)}</span> `:''}<span class="pill x">মান ${bn(qScore(a))}</span> ${a.selected?`<span class="pill g">নির্বাচিত</span> <span class="pill">${STATUS[a.workStatus]||''}</span>`:o.drawn?'<span class="pill x">বাকি</span>':'<span class="pill x">আবেদিত</span>'}</span></summary>
    <div class="det">${a.selected?`<label>স্ট্যাটাস</label><select data-st="${a.id}">${Object.entries(STATUS).filter(([k])=>k!=='applied').map(([k,t])=>`<option value="${k}" ${k===a.workStatus?'selected':''}>${t}</option>`).join('')}</select>`:''}
    <label>ট্যাগ</label><select data-tag><option value="">—</option>${TAGS.map(t=>`<option ${a.tag===t?'selected':''}>${t}</option>`).join('')}</select>
    <label>নোট (শুধু আপনি দেখবেন)</label><textarea data-note maxlength="1000">${esc(a.adminNote||'')}</textarea>
    ${a.selected?`<label>বিজয়ীকে বার্তা</label><textarea data-msg maxlength="600">${esc(a.adminMsg||'')}</textarea>
    <label>কাজের অগ্রগতি (০–১০০)</label><input type="number" min="0" max="100" data-pg value="${typeof a.progress==='number'?a.progress:''}">
    <label>প্রিভিউ লিংক</label><input type="url" data-pv value="${esc(a.previewUrl||'')}" placeholder="https://…">
    <label>APK লিংক</label><input type="url" data-apk value="${esc(a.apkUrl||'')}" placeholder="https://…">`:''}
    <div class="acts"><button class="btn sm" data-sv="${a.id}">সেভ করুন</button>${wa?`<a class="btn sm ghost" href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div>
    ${dl(a)}</div></details></div>`;
  };
  let shown=[];
  const paint=()=>{
    const q=v('q').toLowerCase(),f=$('#flt').value,tg=$('#tagf').value;
    let L=adm.apps.filter(a=>(`${a.name} ${a.email} ${a.appName}`).toLowerCase().includes(q));
    if(f==='sel')L=L.filter(a=>a.selected);else if(f==='rest')L=L.filter(a=>o.drawn&&!a.selected);else if(f==='wait')L=L.filter(a=>o.drawn&&!a.selected).sort((x,y)=>x.order-y.order).slice(0,3);else if(f.startsWith('s:'))L=L.filter(a=>a.workStatus===f.slice(2));
    if(tg)L=L.filter(a=>a.tag===tg);
    L.sort((x,y)=>(x.order??1e9)-(y.order??1e9));
    shown=L;
    $('#list').innerHTML=L.map(row).join('')||'<div class="card mut">কিছু পাওয়া যায়নি।</div>';
    $$('.bkc').forEach(c=>c.addEventListener('change',()=>{c.checked?bkSel.add(c.dataset.bk):bkSel.delete(c.dataset.bk)}));
    $$('[data-st]').forEach(s=>s.addEventListener('change',async()=>{
      try{await updateDoc(doc(db,'offers',o.id,'applications',s.dataset.st),{workStatus:s.value});const a=adm.apps.find(z=>z.id===s.dataset.st);a.workStatus=s.value;syncStats();audit(`${a.email}: স্ট্যাটাস → ${STATUS[s.value]}`);toast('স্ট্যাটাস বদলেছে')}catch(x){toast('হয়নি: '+x.code)}
    }));
    $$('[data-sv]').forEach(b=>b.addEventListener('click',async()=>{
      const a=adm.apps.find(z=>z.id===b.dataset.sv),d=b.closest('.det'),g=s=>d.querySelector(s);
      const priv={tag:g('[data-tag]').value,adminNote:g('[data-note]').value.trim()};

      if(a.selected){
        data.adminMsg=g('[data-msg]').value.trim();
        const pg=g('[data-pg]').value;data.progress=pg===''?0:Math.max(0,Math.min(100,Math.round(+pg)||0));
        const pvR=g('[data-pv]').value.trim(),apR=g('[data-apk]').value.trim();
        data.previewUrl=safeUrl(pvR);data.apkUrl=safeUrl(apR);
        if((pvR&&!data.previewUrl)||(apR&&!data.apkUrl)){toast('লিংক https:// দিয়ে শুরু হতে হবে');return}
      }
      try{await setDoc(doc(db,'offers',o.id,'private','n_'+a.id),priv);Object.assign(a,priv);if(Object.keys(data).length){await updateDoc(doc(db,'offers',o.id,'applications',a.id),data);Object.assign(a,data)}audit(`${a.email}: তথ্য সেভ`);toast('সেভ হয়েছে')}catch(x){toast('হয়নি: '+x.code)}
    }));
    $$('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{const t=b.closest('.info').innerText;try{await navigator.clipboard.writeText(t);toast('কপি হয়েছে')}catch{toast('কপি হয়নি')}}));
  };
  $('#q').addEventListener('input',paint);$('#flt').addEventListener('change',paint);$('#tagf').addEventListener('change',paint);paint();
  $('#ball').addEventListener('click',()=>{shown.filter(a=>a.selected).forEach(a=>bkSel.add(a.id));paint()});
  $('#bapply').addEventListener('click',async()=>{
    if(!bkSel.size){toast('আগে নির্বাচিতদের টিক দিন');return}
    const st=$('#bst').value;
    if(!confirm(`${bkSel.size} জনের স্ট্যাটাস "${STATUS[st]}" করবেন?`))return;
    try{
      const ids=[...bkSel];
      for(let i=0;i<ids.length;i+=400){const b=writeBatch(db);ids.slice(i,i+400).forEach(id=>b.update(doc(db,'offers',o.id,'applications',id),{workStatus:st}));await b.commit()}
      ids.forEach(id=>{const a=adm.apps.find(z=>z.id===id);if(a)a.workStatus=st});syncStats();
      audit(`বাল্ক স্ট্যাটাস: ${ids.length} জন → ${STATUS[st]}`);bkSel.clear();toast('স্ট্যাটাস বদলেছে');paint();
    }catch(x){toast('হয়নি: '+x.code)}
  });
  $('#bk').addEventListener('click',()=>{
    const j=JSON.stringify({exportedAt:new Date().toISOString(),offer:o,applications:adm.apps},null,2);
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download='backup-'+o.id+'.json';l.click();
    audit('JSON ব্যাকআপ নামানো');
  });
  $('#csv').addEventListener('click',()=>{
    const H=['name','email','appName','appPurpose','feature1','feature2','feature3','targetUsers','appType','needsInternet','usedFor','fbLink','selected','order','workStatus','whatsapp','finalName'];
    const q=s=>{let t=String(s??'');if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
    const csv='\ufeff'+[H.join(',')].concat(adm.apps.map(a=>H.map(h=>q(h==='whatsapp'?a.step2?.whatsapp:h==='finalName'?a.step2?.finalName:a[h])).join(','))).join('\n');
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));l.download='applications.csv';l.click();
  });
}

  ${o.drawn?'<button class="btn ghost" id="next">পরের জনকে সুযোগ দিন</button>':''}</div>
  ${o.drawn?`<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="pub">${o.winnersList?.length?'তালিকা হালনাগাদ':'নির্বাচিতদের তালিকা প্রকাশ'}</button>${o.winnersList?.length?'<button class="btn sm ghost" id="unpub">তালিকা সরান</button>':''}<button class="btn sm ghost" id="vf">প্রমাণ কোড মিলান</button></div>`:''}
  ${o.drawn?`<h3>নির্বাচিত</h3>${win.sort((a,b)=>a.order-b.order).map(a=>`<div>• ${esc(a.name)} — ${esc(a.email)} <span class="pill">${STATUS[a.workStatus]}</span></div>`).join('')}`:''}</div>
  <div class="card"><h2>📧 মেইল</h2><p class="mut">Gmail-এ সবার ঠিকানা BCC-তে বসে খুলবে, আপনি শুধু Send চাপবেন। বাছাইয়ের আগে মেইল পাঠানো যাবে না।</p>
  <label>বিজয়ীদের মেইল</label><textarea id="wm" style="min-height:140px"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn sm" id="wg" ${o.drawn?'':'disabled'}>Gmail-এ খুলুন (${win.length} জন)</button><button class="btn sm ghost" id="wc" ${o.drawn?'':'disabled'}>ঠিকানা কপি</button></div>
  <label>বাকিদের মেইল</label><textarea id="rm" style="min-height:120px"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn sm" id="rg" ${o.drawn?'':'disabled'}>Gmail-এ খুলুন (${rest.length} জন)</button><button class="btn sm ghost" id="rc" ${o.drawn?'':'disabled'}>ঠিকানা কপি</button></div>
  <div class="row" style="margin-top:12px"><button class="btn sm gold" id="tsv">মেইল টেমপ্লেট সেভ</button><button class="btn sm ghost" id="trs">ডিফল্টে ফেরান</button></div></div>`;
  $('#wm').value=adm.meta.tplWin||`অভিনন্দন! 🎉\n\n"${o.title}" অফারে আপনি নির্বাচিত হয়েছেন।\n\nআবেদনের সময় যে Gmail দিয়ে লগইন করেছিলেন, সেই Gmail দিয়ে এই লিংকে ঢুকে ${fmt(o.detailsEnd)}-এর মধ্যে ধাপ ২ ফর্ম পূরণ করুন:\n${link}\n\n— HafijulNovaLabs`;
  $('#rm').value=adm.meta.tplRest||`আবেদনের জন্য ধন্যবাদ।\n\n"${o.title}" অফারে এবার আপনি নির্বাচিত হননি। পরের অফারে আবার চেষ্টা করুন।\n\nফলাফল দেখতে: ${link}\n\n— HafijulNovaLabs`;
  const gm=(list,body)=>{const e=list.map(a=>a.email).join(',');window.open(`https://mail.google.com/mail/?view=cm&fs=1&bcc=${encodeURIComponent(e)}&su=${encodeURIComponent(o.title+' — ফলাফল')}&body=${encodeURIComponent(body)}`,'_blank')};
  const cp=async list=>{try{await navigator.clipboard.writeText(list.map(a=>a.email).join(', '));toast('ঠিকানা কপি হয়েছে')}catch{toast('কপি হয়নি')}};
  $('#wg').onclick=()=>gm(win,$('#wm').value);$('#rg').onclick=()=>gm(rest,$('#rm').value);
  $('#wc').onclick=()=>cp(win);$('#rc').onclick=()=>cp(rest);
  $('#tsv').addEventListener('click',async()=>{try{const d={tplWin:$('#wm').value,tplRest:$('#rm').value};await setDoc(doc(db,'offers',o.id,'private','meta'),d,{merge:true});Object.assign(adm.meta,d);audit('মেইল টেমপ্লেট সেভ');toast('টেমপ্লেট সেভ হয়েছে')}catch(x){toast('হয়নি: '+x.code)}});
  $('#trs').addEventListener('click',async()=>{try{const d={tplWin:'',tplRest:''};await setDoc(doc(db,'offers',o.id,'private','meta'),d,{merge:true});Object.assign(adm.meta,d);toast('ডিফল্টে ফেরানো হয়েছে');drawAdmin()}catch(x){toast('হয়নি: '+x.code)}});
  $('#pub')?.addEventListener('click',async()=>{
    const names=win.slice().sort((a,b)=>a.order-b.order).map(a=>a.name||'নাম নেই');
    if(!confirm(`${names.length} জনের নাম পাবলিক পেজে সবাই দেখতে পাবে। প্রকাশ করবেন?`))return;
    try{await updateDoc(doc(db,'offers',o.id),{winnersList:names});o.winnersList=names;audit('নির্বাচিতদের তালিকা প্রকাশ');toast('প্রকাশ হয়েছে');drawAdmin()}catch(x){toast('হয়নি: '+x.code)}
  });
  $('#unpub')?.addEventListener('click',async()=>{try{await updateDoc(doc(db,'offers',o.id),{winnersList:[]});o.winnersList=[];audit('তালিকা সরানো');drawAdmin()}catch(x){toast('হয়নি: '+x.code)}});
  $('#vf')?.addEventListener('click',async()=>{
    if(!o.proofHash){toast('এই বাছাইয়ে প্রমাণ কোড সংরক্ষিত নেই');return}
    const ids=adm.apps.filter(a=>a.order).sort((a,b)=>a.order-b.order).map(a=>a.id);
    toast((await sha(o.id+'|'+ids.join(',')))===o.proofHash?'কোড মিলেছে: ফলাফল অপরিবর্তিত':'কোড মেলেনি: ফলাফল বদলেছে');
  });
  $('#go')?.addEventListener('click',async()=>{
    const n=Math.min(+v('N')||0,adm.apps.length);
    if(n<1){toast('সংখ্যা দিন');return}
    if(!confirm(`${adm.apps.length} জনের মধ্যে র‍্যান্ডমভাবে ${n} জন বাছাই হবে। ফলাফল স্থির, আবার চালানো যাবে না। চালাবেন?`))return;
    $('#go').disabled=true;
    const arr=adm.apps.slice();for(let i=arr.length-1;i>0;i--){const j=rand(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}
    try{
      await spin(arr.map(a=>a.name||a.email));
      for(let i=0;i<arr.length;i+=400){const b=writeBatch(db);arr.slice(i,i+400).forEach((a,k)=>{const idx=i+k;b.update(doc(db,'offers',o.id,'applications',a.id),{order:idx+1,selected:idx<n,workStatus:idx<n?'info_pending':'applied'})});await b.commit()}
      const proofHash=await sha(o.id+'|'+arr.map(a=>a.id).join(','));
      await updateDoc(doc(db,'offers',o.id),{drawn:true,winnersN:n,drawnAt:serverTimestamp(),proofHash});
      await audit(`বাছাই: ${arr.length} জনের মধ্যে ${n} জন`);
      toast('বাছাই সম্পন্ন');await loadOffers();drawAdmin();
    }catch(x){toast('বাছাই ব্যর্থ: '+(x.code||x.message));$('#go').disabled=false}
  });
  $('#next')?.addEventListener('click',async()=>{
    const nx=rest.sort((a,b)=>a.order-b.order)[0];
    if(!nx){toast('অপেক্ষমাণ কেউ নেই');return}
    if(!confirm(`পরের জন: ${nx.name} (${nx.email})। সুযোগ দেবেন?`))return;
    try{await updateDoc(doc(db,'offers',o.id,'applications',nx.id),{selected:true,workStatus:'info_pending'});audit('অপেক্ষমাণকে সুযোগ: '+nx.email);toast('সুযোগ দেওয়া হয়েছে');drawAdmin()}catch(x){toast('হয়নি: '+x.code)}
  });
}


/* ================= শুরু ================= */
onAuthStateChanged(auth,u=>{user=u;isAdmin=!!u&&u.emailVerified&&ADMIN_EMAILS.includes((u.email||'').toLowerCase());renderWho(user,isAdmin,'admin');renderAdmin()});


</script>
</body>
</html>
