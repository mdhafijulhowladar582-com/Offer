<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>ফ্রি অ্যান্ড্রয়েড অ্যাপ অফার — HafijulNovaLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--fg:#41e66b;--dim:#1f7a38;--mid:#2f9a4c;--fill:#0c2a14;--warn:#ffb000;--bad:#ff6b63}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.7 'JetBrains Mono','Hind Siliguri',ui-monospace,monospace}
a{color:var(--fg);text-underline-offset:3px}
a:hover{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
::selection{background:var(--fg);color:var(--bg)}

.bar{border-bottom:1px solid var(--dim)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:700;text-decoration:none}
.brand:hover{background:transparent;color:var(--fg)}
.brand::before{content:'$';color:var(--mid)}
.brand::after{content:'█';animation:blink 1.1s steps(1) infinite}
.brand .logo-img{width:26px;height:26px;object-fit:cover;border:1px solid var(--dim)}
.who{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 10px;font-size:13px;color:var(--mid)}
.who img{width:28px;height:28px;border:1px solid var(--dim)}
.who span{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who a{color:var(--fg)}
.wrap{max-width:760px;margin:0 auto;padding:6px 16px 40px}
#app{padding-top:10px}
.foot{border-top:1px solid var(--dim);margin-top:24px}
.foot .wrap{text-align:center;padding-bottom:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 18px;font:inherit;font-weight:700;color:var(--fg);background:transparent;border:1px solid var(--fg);border-radius:0;cursor:pointer}
.btn:hover,.btn:active{background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed;background:transparent;color:var(--fg)}
.btn.ghost{color:var(--mid);border-color:var(--dim)}
.btn.ghost:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.gold{color:var(--warn);border-color:var(--warn)}
.btn.gold:hover{background:var(--warn);color:#000}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.bad:hover{background:var(--bad);color:#000}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px}

/* title block */
.cmd{color:var(--mid);font-size:13px}
.hd{display:flex;gap:14px;align-items:flex-start;margin:6px 0 14px}
.hd .logo-img{width:56px;height:56px;object-fit:cover;border:1px solid var(--dim);flex:none}
h1{font-size:25px;line-height:1.4;font-weight:700;text-shadow:0 0 14px #41e66b55}
h1::before{content:'# ';color:var(--mid)}
.sub{color:var(--mid);margin-top:2px}
.infobox{border:1px solid var(--fg);padding:12px 14px}
.infobox b{display:block}
.infobox b::before{content:'> ';color:var(--mid)}
.infobox span{color:var(--mid);font-size:14px}

/* windows */
.card{position:relative;border:1px solid var(--dim);padding:26px 16px 16px;margin:24px 0 0}
.card>h2:first-child{position:absolute;top:-.85em;left:12px;max-width:calc(100% - 24px);margin:0;padding:0 8px;background:var(--bg);font-size:14px;line-height:1.6;font-weight:700}
.card>h2:first-child::before{content:'[ '}
.card>h2:first-child::after{content:' ]'}
h2{font-size:16px;line-height:1.5;margin-bottom:10px}
h3{font-size:14px;margin:26px 0 4px;padding-bottom:4px;color:var(--mid);border-bottom:1px dashed var(--dim)}
h3::before{content:'## '}
label{display:block;margin:16px 0 4px;font-weight:700;font-size:14px}
label small{font-weight:400;color:var(--mid)}
input[type=text],input[type=url],input[type=tel],input[type=number],input[type=datetime-local],select,textarea{width:100%;font:inherit;padding:10px 12px;color:var(--fg);background:transparent;border:1px solid var(--dim);border-radius:0;caret-color:var(--fg)}
option{background:#000;color:var(--fg)}
::placeholder{color:var(--dim);opacity:1}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:1px solid var(--fg);border-color:var(--fg)}
.cnt{font-size:12px;color:var(--dim);text-align:right}.cnt.ok{color:var(--fg)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-weight:400}
.chk input{width:20px;height:20px;margin-top:5px;flex:none;accent-color:var(--fg)}
.msg{padding:10px 14px;margin:12px 0;font-size:14.5px;background:var(--fill);border-left:3px solid var(--fg)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.msg.warn{border-color:var(--warn);color:var(--warn)}
.msg.info{border-color:var(--dim)}
.pill{display:inline-block;font-size:13px;font-weight:700;color:var(--fg);white-space:nowrap}
.pill::before{content:'['}.pill::after{content:']'}
.pill.g{color:var(--warn)}.pill.x{color:var(--mid)}.pill.ok{color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}.grow{flex:1 1 140px!important}
.mut{color:var(--mid);font-size:13.5px}

/* schedule */
.stages{list-style:none;padding:0;margin:0}
.stages li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--dim)}
.stages li:last-child{border-bottom:0}
.stages li::before{content:'[ ]';color:var(--dim)}
.stages li.done::before{content:'[x]';color:var(--mid)}
.stages li.on{background:var(--fill)}
.stages li.on::before{content:'[>]';color:var(--warn);font-weight:700}
.stages b{display:block}
.stages li div span{color:var(--mid);font-size:13px}
.notes{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.notes li{display:flex;gap:10px;align-items:flex-start}
.ico{flex:none;font-weight:700;color:var(--mid)}
.ico.w{color:var(--warn)}
.ico::before{content:'['}.ico::after{content:']'}

/* admin */
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;border-bottom:1px solid var(--dim)}
.tabs button{border:0;background:transparent;color:var(--mid);padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--fg);color:var(--bg)}
#list{border-top:1px dashed var(--dim)}
details{border-bottom:1px dashed var(--dim)}
summary{padding:11px 6px;cursor:pointer;list-style:none;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
summary:hover{background:var(--fill)}
summary::-webkit-details-marker{display:none}
.det{padding:4px 6px 16px;font-size:14.5px;word-break:break-word}
.det dt{font-weight:700;margin-top:10px;color:var(--mid);font-size:13px}.det dd{margin:0;white-space:pre-wrap}
.sc{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:10px;padding:10px;border:1px dashed var(--dim)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:var(--fg);border:1px solid var(--fg);padding:10px 18px;z-index:9;max-width:90vw;font-size:14.5px}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.brand::after{animation:none}}
@media(max-width:480px){h1{font-size:21px}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#"><span>HafijulNovaLabs</span></a>
  <div id="who" class="who"></div>
</div></header>
<main class="wrap">
  <div id="app"><div class="card">লোড হচ্ছে…</div></div>
</main>
<footer class="foot"><div class="wrap">
  <p class="mut">ব্যক্তিগত উদ্যোগ — কোনো কোম্পানি বা প্রতিষ্ঠানের সঙ্গে আনুষ্ঠানিক সম্পর্ক নেই।<br><a href="#admin" id="admlink">অ্যাডমিন</a></p>
</div></footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,query,where,limit,orderBy,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== কনফিগ ====== */
const firebaseConfig = {
  apiKey: "AIzaSyAFv6mpdhQ-UsgiptrjKFsxzJ_opCazmEk",
  authDomain: "offer-d5dd7.firebaseapp.com",
  projectId: "offer-d5dd7",
  storageBucket: "offer-d5dd7.firebasestorage.app",
  messagingSenderId: "85495519418",
  appId: "1:85495519418:web:ce4ea3ff9d0af4c1394a83"
};
const LOGO_URL = ""; // এখানে লোগোর সরাসরি লিংক বসান (যেমন https://i.ibb.co/xxxx/logo.png). ফাঁকা থাকলে তারা-আইকন দেখাবে
const ADMIN_EMAILS = ["mdhafijulhowladar582@gmail.com"]; // firestore.rules-এও একই মেইল থাকতে হবে
/* ==================== */

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb), db = getFirestore(fb), provider = new GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
if(LOGO_URL){const b=document.querySelector('.brand svg');if(b){const im=document.createElement('img');im.src=LOGO_URL;im.alt='';im.className='logo-img';b.replaceWith(im)}}
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms=>ms?new Date(ms).toLocaleString('bn-BD',{day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const toLocalInput = ms=>ms?new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,16):'';
const STATUS = {applied:'আবেদিত',info_pending:'তথ্য বাকি',info_submitted:'তথ্য জমা',in_progress:'কাজ চলছে',delivered:'ডেলিভারি হয়েছে'};
const TYPES = ['Note / Tracker','Utility / Calculator','Website → Android app','Form / Data storage','Lock / PIN / Settings','অন্যান্য'];
const inApp = /FBAN|FBAV|FB_IAB|Instagram|Messenger/i.test(navigator.userAgent);

let user=null, isAdmin=false, offer=null;

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
async function login(){
  try{await signInWithPopup(auth,provider)}
  catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)) signInWithRedirect(auth,provider);
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request') toast('লগইন হয়নি ('+e.code+')');
  }
}
const loginBlock = ()=>`
  ${inApp?`<div class="msg warn"><b>ফেসবুকের ভেতরের ব্রাউজারে Google লগইন কাজ করে না।</b><br>ডানদিকের ⋮ মেনু থেকে <b>Open in Chrome / ব্রাউজারে খুলুন</b> চাপুন, অথবা লিংকটা কপি করে Chrome-এ খুলুন।<div style="margin-top:8px"><button class="btn sm gold" id="cplink">লিংক কপি করুন</button></div></div>`:''}
  <button class="btn" id="login">Google দিয়ে লগইন করুন</button>`;
function bindLogin(){
  $('#login')?.addEventListener('click',login);
  $('#cplink')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href.split('#')[0]);toast('লিংক কপি হয়েছে')}catch{toast('কপি হয়নি')}});
}
function renderWho(){
  if(!user){$('#who').innerHTML='<button class="btn sm" id="hlogin">লগইন</button>';$('#hlogin').addEventListener('click',login);return}
  $('#who').innerHTML = user?`${user.photoURL?`<img src="${esc(user.photoURL)}" alt="">`:''}<span>${esc(user.displayName||user.email)}</span>${isAdmin&&location.hash!=='#admin'?'<a href="#admin">অ্যাডমিন</a>':''}${location.hash==='#admin'?'<a href="#">হোম</a>':''}<button class="btn ghost sm" id="out">বের হন</button>`:'';
  $('#out')?.addEventListener('click',()=>signOut(auth));
}
function counters(root){
  $$('[data-min]',root).forEach(el=>{
    const min=+el.dataset.min, c=document.createElement('div');c.className='cnt';el.after(c);
    const up=()=>{const n=el.value.trim().length;c.textContent=n+' / ন্যূনতম '+min;c.className='cnt'+(n>=min?' ok':'')};
    el.addEventListener('input',up);up();
  });
}
const v = id=>($('#'+id)?.value||'').trim();

/* ================= পাবলিক পেজ ================= */
async function loadOpenOffer(){
  const s=await getDocs(query(collection(db,'offers'),where('status','==','open'),limit(1)));
  return s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};
}
const STAR='';
function ticket(o){
  const now=Date.now();
  const s1=now<=o.applyEnd?['on','চলছে']:['done','শেষ'];
  const s2=o.drawn?['done','সম্পন্ন']:now>=o.drawDate?['on','চলছে']:['next','আসছে'];
  const s3=now>o.detailsEnd?['done','শেষ']:o.drawn?['on','চলছে']:['next','আসছে'];
  const tag={on:'pill g',done:'pill x',next:'pill'};
  const row=(s,t,d)=>`<li class="${s[0]}"><div><b>${t}</b><span>${d}</span></div><span class="${tag[s[0]]}">${s[1]}</span></li>`;
  const n=(+o.winnersCount||0).toLocaleString('bn-BD');
  const stages=`<ol class="stages">${row(s1,'আবেদন','শেষ সময়: '+fmt(o.applyEnd))}${row(s2,'র‍্যান্ডম বাছাই',fmt(o.drawDate))}${row(s3,'বিজয়ীর তথ্য জমা','শেষ সময়: '+fmt(o.detailsEnd))}</ol>`;
  const notes=user?'':`<section class="card"><h2>আবেদনের আগে জেনে নিন</h2><ul class="notes">
    <li><span class="ico w" aria-hidden="true">!</span><span>গেম, পেমেন্ট/ব্যাংকিং বা বেআইনি ধরনের অ্যাপ চাওয়া যাবে না।</span></li>
    <li><span class="ico w" aria-hidden="true">!</span><span>আবেদন একবার জমা দিলে আর এডিট করা যাবে না।</span></li>
    <li><span class="ico" aria-hidden="true">i</span><span>ফলাফল আপনার লগইন করা Gmail-এ জানানো হবে।</span></li>
    ${o.rulesUrl?`<li><span class="ico" aria-hidden="true">i</span><span><a href="${esc(o.rulesUrl)}" target="_blank" rel="noopener">পুরো নিয়মাবলি পড়ুন</a></span></li>`:''}
  </ul></section>`;
  const logo=LOGO_URL?`<img class="logo-img" src="${esc(LOGO_URL)}" alt="">`:'';
  return `<div class="boot"><p class="cmd">$ cat offer.txt</p>
  <div class="hd">${logo}<div><h1>${esc(o.title)}</h1><p class="sub">${esc(o.description||'')}</p></div></div>
  <div class="infobox"><b>র‍্যান্ডম বাছাইয়ে ${n} জন নির্বাচিত হবেন।</b><span>আবেদন শেষ হলে একবারই বাছাই চলবে, ফলাফল আর বদলানো যাবে না।</span></div></div>
  <section class="card"><h2>সময়সূচি</h2>${stages}</section>
  ${notes}`;
}
async function renderPublic(){
  const app=$('#app');
  app.innerHTML='<div class="card">লোড হচ্ছে…</div>';
  try{offer=await loadOpenOffer()}catch(e){app.innerHTML='<div class="msg bad">ডেটা আনা যায়নি। Firestore চালু ও রুলস পাবলিশ করা আছে কি না দেখুন।</div>';return}
  if(!offer){app.innerHTML='<div class="card"><h2>এই মুহূর্তে কোনো অফার চালু নেই</h2><p class="mut">নতুন অফার এলে ফেসবুক পেজে জানানো হবে।</p></div>'+(user?'':'<div class="card"><p class="mut" style="margin-bottom:10px">আগে আবেদন করে থাকলে লগইন করে অবস্থা দেখুন।</p>'+loginBlock()+'</div>');bindLogin();return}
  let html=ticket(offer);
  if(!user){app.innerHTML=html+`<div class="card"><h2>আবেদন করতে লগইন করুন</h2><p class="mut" style="margin-bottom:12px">আপনার নাম ও Gmail আবেদনের সঙ্গে জমা হবে। ফলাফল এই Gmail-এ জানানো হবে।</p>${loginBlock()}</div>`;bindLogin();return}
  const ref=doc(db,'offers',offer.id,'applications',user.uid);
  let snap;try{snap=await getDoc(ref)}catch(e){app.innerHTML=html+'<div class="msg bad">আপনার আবেদন লোড করা যায়নি।</div>';return}
  const now=Date.now();
  if(!snap.exists()){
    if(now>offer.applyEnd){app.innerHTML=html+'<div class="card"><h2>আবেদন বন্ধ</h2><p class="mut">আবেদনের সময় শেষ হয়ে গেছে।</p></div>';return}
    app.innerHTML=html+step1Html();bindStep1(ref);return;
  }
  const a=snap.data();
  if(!offer.drawn){
    app.innerHTML=html+`<div class="card"><h2>আপনার আবেদন জমা হয়েছে</h2><div class="msg ok">বাছাইয়ের তারিখ: ${fmt(offer.drawDate)}। ফলাফল আপনার Gmail-এ জানানো হবে এবং এই লিংকেও দেখা যাবে।</div>
    <dl class="det" style="border:0;padding:0"><dt>অ্যাপের নাম</dt><dd>${esc(a.appName)}</dd><dt>কী করবে</dt><dd>${esc(a.appPurpose)}</dd></dl></div>`;return;
  }
  if(!a.selected){
    app.innerHTML=html+'<div class="card"><h2>এবার সুযোগ হয়নি</h2><p class="mut">আবেদনের জন্য ধন্যবাদ। পরের অফারে আবার চেষ্টা করুন।</p></div>';return;
  }
  if(a.workStatus==='info_pending'){
    if(now>offer.detailsEnd){app.innerHTML=html+'<div class="card"><h2>তথ্য জমার সময় শেষ</h2><p class="mut">নির্ধারিত সময়ে তথ্য জমা না হওয়ায় এখন আর জমা নেওয়া যাচ্ছে না। কিছু বলার থাকলে সরাসরি যোগাযোগ করুন।</p></div>';return}

async function loadOffers(){
  const s=await getDocs(query(collection(db,'offers'),orderBy('createdAt','desc')));
  adm.offers=s.docs.map(d=>({id:d.id,...d.data()}));
  if(!adm.cur||!adm.offers.find(o=>o.id===adm.cur)) adm.cur=(adm.offers.find(o=>o.status==='open')||adm.offers[0]||{}).id||null;
}
async function loadApps(){
  if(!adm.cur){adm.apps=[];return}
  const s=await getDocs(collection(db,'offers',adm.cur,'applications'));
  adm.apps=s.docs.map(d=>({id:d.id,...d.data()}));
}
const curOffer=()=>adm.offers.find(o=>o.id===adm.cur);

async function drawAdmin(){
  const app=$('#app');
  await loadApps();
  const o=curOffer();
  app.innerHTML=`<div class="card"><div class="row"><select id="sel" class="grow">${adm.offers.map(x=>`<option value="${x.id}" ${x.id===adm.cur?'selected':''}>${esc(x.title)} (${x.status==='open'?'চালু':x.status==='closed'?'বন্ধ':'খসড়া'})</option>`).join('')||'<option>কোনো অফার নেই</option>'}</select>

  <div class="tabs">${[['offer','অফার'],['apps','আবেদন ('+adm.apps.length+')'],['draw','বাছাই ও মেইল']].map(([k,t])=>`<button data-t="${k}" class="${adm.tab===k?'on':''}">${t}</button>`).join('')}</div><div id="pane"></div>`;
  $('#sel').addEventListener('change',e=>{adm.cur=e.target.value;drawAdmin()});

      if(o.id)toast('সেভ হয়েছে');await loadOffers();drawAdmin();
    }catch(x){toast('সেভ হয়নি: '+(x.code||x.message))}
  });
  $('#open')?.addEventListener('click',async()=>{
    try{const b=writeBatch(db);adm.offers.filter(x=>x.status==='open').forEach(x=>b.update(doc(db,'offers',x.id),{status:'closed'}));b.update(doc(db,'offers',o.id),{status:'open'});await b.commit();toast('অফার চালু');await loadOffers();drawAdmin()}catch(x){toast('হয়নি: '+x.code)}
  });
  $('#close')?.addEventListener('click',async()=>{if(!confirm('অফার বন্ধ করবেন? এরপর কেউ আর এই অফার দেখবে না।'))return;try{await updateDoc(doc(db,'offers',o.id),{status:'closed'});await loadOffers();drawAdmin()}catch(x){toast('হয়নি: '+x.code)}});
}

function dl(a){
  const rows=(pairs)=>pairs.filter(([,x])=>x!==undefined&&x!=='').map(([k,x])=>`<dt>${k}</dt><dd>${esc(x)}</dd>`).join('');
  const s2=a.step2;
  return `<dl>${rows([['Gmail',a.email],['অ্যাপের নাম',a.appName],['কী করবে',a.appPurpose],['ফিচার ১',a.feature1],['ফিচার ২',a.feature2],['ফিচার ৩',a.feature3],['কার জন্য',a.targetUsers],['ধরন',a.appType+(a.appTypeOther?' — '+a.appTypeOther:'')],['ইন্টারনেট',a.needsInternet],['কার জন্য ব্যবহার',a.usedFor],['ফেসবুক',a.fbLink]])}</dl>
  ${s2?`<h3>ধাপ ২ তথ্য</h3><dl>${rows([['পুরো নাম',s2.fullName],['WhatsApp',s2.whatsapp],['বিকল্প',s2.altContact],['যোগাযোগের সময়',s2.contactTime],['চূড়ান্ত নাম',s2.finalName],['বর্ণনা',s2.description],['স্ক্রিন',(s2.screens||[]).map(x=>x.name+(x.desc?' — '+x.desc:'')).join('\n')],['ফিচার বিস্তারিত',(s2.featureDetails||[]).map((x,i)=>(i+1)+'. '+x).join('\n\n')],['ডেটা',s2.dataInfo],['ইন্টারনেট',s2.needsInternet],['লগইন',s2.needsLogin],['ভাষা',s2.language],['রঙ',s2.color],['থিম',s2.theme],['রেফারেন্স',s2.refLink],['আইকন',s2.iconIdea],['UI',s2.uiStyle]])}</dl>
  <button class="btn sm ghost" data-copy="${a.id}">তথ্য কপি করুন</button>`:''}`;
}
function paneApps(o){
  const p=$('#pane');
  if(!o){p.innerHTML='<div class="card">আগে অফার বানান।</div>';return}
  p.innerHTML=`<div class="card"><div class="row"><input type="text" id="q" class="grow" placeholder="নাম, Gmail বা অ্যাপের নামে খুঁজুন">
  <select id="flt"><option value="all">সব</option><option value="sel">নির্বাচিত</option><option value="wait">অপেক্ষমাণ</option><option value="rest">বাকিরা</option>${Object.entries(STATUS).filter(([k])=>k!=='applied').map(([k,t])=>`<option value="s:${k}">${t}</option>`).join('')}</select>
  <button class="btn sm ghost" id="csv">CSV</button></div></div><div id="list"></div>`;
  const paint=()=>{
    const q=v('q').toLowerCase(),f=$('#flt').value;
    let L=adm.apps.filter(a=>(`${a.name} ${a.email} ${a.appName}`).toLowerCase().includes(q));
    if(f==='sel')L=L.filter(a=>a.selected);else if(f==='rest')L=L.filter(a=>o.drawn&&!a.selected);else if(f==='wait')L=L.filter(a=>o.drawn&&!a.selected).sort((x,y)=>x.order-y.order).slice(0,3);else if(f.startsWith('s:'))L=L.filter(a=>a.workStatus===f.slice(2));
    L.sort((x,y)=>(x.order??1e9)-(y.order??1e9));
    $('#list').innerHTML=L.map(a=>`<details><summary><span><b>${esc(a.name||a.email)}</b> — ${esc(a.appName)}</span><span>${a.selected?`<span class="pill g">নির্বাচিত</span> <span class="pill">${STATUS[a.workStatus]||''}</span>`:o.drawn?'<span class="pill x">বাকি</span>':'<span class="pill x">আবেদিত</span>'}</span></summary>
    <div class="det">${a.selected?`<label>স্ট্যাটাস</label><select data-st="${a.id}">${Object.entries(STATUS).filter(([k])=>k!=='applied').map(([k,t])=>`<option value="${k}" ${k===a.workStatus?'selected':''}>${t}</option>`).join('')}</select>`:''}${dl(a)}</div></details>`).join('')||'<div class="card mut">কিছু পাওয়া যায়নি।</div>';
    $$('[data-st]').forEach(s=>s.addEventListener('change',async()=>{try{await updateDoc(doc(db,'offers',o.id,'applications',s.dataset.st),{workStatus:s.value});adm.apps.find(a=>a.id===s.dataset.st).workStatus=s.value;toast('স্ট্যাটাস বদলেছে')}catch(x){toast('হয়নি: '+x.code)}}));
    $$('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{const a=adm.apps.find(z=>z.id===b.dataset.copy);const t=b.closest('.det').innerText;try{await navigator.clipboard.writeText(t);toast('কপি হয়েছে')}catch{toast('কপি হয়নি')}}));
  };
  $('#q').addEventListener('input',paint);$('#flt').addEventListener('change',paint);paint();
  $('#csv').addEventListener('click',()=>{
    const H=['name','email','appName','appPurpose','feature1','feature2','feature3','targetUsers','appType','needsInternet','usedFor','fbLink','selected','order','workStatus','whatsapp','finalName'];
    const q=s=>{let t=String(s??'');if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
    const csv='\ufeff'+[H.join(',')].concat(adm.apps.map(a=>H.map(h=>q(h==='whatsapp'?a.step2?.whatsapp:h==='finalName'?a.step2?.finalName:a[h])).join(','))).join('\n');
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));l.download='applications.csv';l.click();
  });
}

function rand(n){const m=Math.floor(0x100000000/n)*n,b=new Uint32Array(1);do{crypto.getRandomValues(b)}while(b[0]>=m);return b[0]%n}
function paneDraw(o){
  const p=$('#pane');
  if(!o){p.innerHTML='<div class="card">আগে অফার বানান।</div>';return}
  const link=location.href.split('#')[0];
  const win=adm.apps.filter(a=>a.selected),rest=adm.apps.filter(a=>!a.selected);
  p.innerHTML=`<div class="card"><h2>🎲 র‍্যান্ডম বাছাই</h2>
  <p class="mut">মোট আবেদন: <b>${adm.apps.length}</b> জন। ${o.drawn?`বাছাই হয়ে গেছে (নির্বাচিত ${win.length} জন)। ফলাফল স্থির, আবার চালানো যাবে না।`:'চালালে ফলাফল স্থির হয়ে যাবে।'}</p>
  <div class="row" style="margin-top:10px"><input type="number" id="N" min="1" value="${o.winnersN||o.winnersCount||4}" style="width:90px"><button class="btn gold" id="go" ${o.drawn||!adm.apps.length?'disabled':''}>র‍্যান্ডম বাছাই করুন</button>
  ${o.drawn?'<button class="btn ghost" id="next">পরের জনকে সুযোগ দিন</button>':''}</div>
  ${o.drawn?`<h3>নির্বাচিত</h3>${win.sort((a,b)=>a.order-b.order).map(a=>`<div>• ${esc(a.name)} — ${esc(a.email)} <span class="pill">${STATUS[a.workStatus]}</span></div>`).join('')}`:''}</div>
  <div class="card"><h2>📧 মেইল</h2><p class="mut">Gmail-এ সবার ঠিকানা BCC-তে বসে খুলবে, আপনি শুধু Send চাপবেন। বাছাইয়ের আগে মেইল পাঠানো যাবে না।</p>
  <label>বিজয়ীদের মেইল</label><textarea id="wm" style="min-height:140px"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn sm" id="wg" ${o.drawn?'':'disabled'}>Gmail-এ খুলুন (${win.length} জন)</button><button class="btn sm ghost" id="wc" ${o.drawn?'':'disabled'}>ঠিকানা কপি</button></div>
  <label>বাকিদের মেইল</label><textarea id="rm" style="min-height:120px"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn sm" id="rg" ${o.drawn?'':'disabled'}>Gmail-এ খুলুন (${rest.length} জন)</button><button class="btn sm ghost" id="rc" ${o.drawn?'':'disabled'}>ঠিকানা কপি</button></div></div>`;
  $('#wm').value=`অভিনন্দন! 🎉\n\n"${o.title}" অফারে আপনি নির্বাচিত হয়েছেন।\n\nআবেদনের সময় যে Gmail দিয়ে লগইন করেছিলেন, সেই Gmail দিয়ে এই লিংকে ঢুকে ${fmt(o.detailsEnd)}-এর মধ্যে ধাপ ২ ফর্ম পূরণ করুন:\n${link}\n\n— HafijulNovaLabs`;
  $('#rm').value=`আবেদনের জন্য ধন্যবাদ।\n\n"${o.title}" অফারে এবার আপনি নির্বাচিত হননি। পরের অফারে আবার চেষ্টা করুন।\n\nফলাফল দেখতে: ${link}\n\n— HafijulNovaLabs`;
  const gm=(list,body)=>{const e=list.map(a=>a.email).join(',');window.open(`https://mail.google.com/mail/?view=cm&fs=1&bcc=${encodeURIComponent(e)}&su=${encodeURIComponent(o.title+' — ফলাফল')}&body=${encodeURIComponent(body)}`,'_blank')};
  const cp=async list=>{try{await navigator.clipboard.writeText(list.map(a=>a.email).join(', '));toast('ঠিকানা কপি হয়েছে')}catch{toast('কপি হয়নি')}};
  $('#wg').onclick=()=>gm(win,$('#wm').value);$('#rg').onclick=()=>gm(rest,$('#rm').value);
  $('#wc').onclick=()=>cp(win);$('#rc').onclick=()=>cp(rest);
  $('#go')?.addEventListener('click',async()=>{
    const n=Math.min(+v('N')||0,adm.apps.length);
    if(n<1){toast('সংখ্যা দিন');return}
    if(!confirm(`${adm.apps.length} জনের মধ্যে র‍্যান্ডমভাবে ${n} জন বাছাই হবে। ফলাফল স্থির, আবার চালানো যাবে না। চালাবেন?`))return;
    $('#go').disabled=true;
    const arr=adm.apps.slice();for(let i=arr.length-1;i>0;i--){const j=rand(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}
    try{
      for(let i=0;i<arr.length;i+=400){const b=writeBatch(db);arr.slice(i,i+400).forEach((a,k)=>{const idx=i+k;b.update(doc(db,'offers',o.id,'applications',a.id),{order:idx+1,selected:idx<n,workStatus:idx<n?'info_pending':'applied'})});await b.commit()}
      await updateDoc(doc(db,'offers',o.id),{drawn:true,winnersN:n,drawnAt:serverTimestamp()});
      toast('বাছাই সম্পন্ন');await loadOffers();drawAdmin();
    }catch(x){toast('বাছাই ব্যর্থ: '+(x.code||x.message));$('#go').disabled=false}
  });
  $('#next')?.addEventListener('click',async()=>{
    const nx=rest.sort((a,b)=>a.order-b.order)[0];
    if(!nx){toast('অপেক্ষমাণ কেউ নেই');return}
    if(!confirm(`পরের জন: ${nx.name} (${nx.email})। সুযোগ দেবেন?`))return;
    try{await updateDoc(doc(db,'offers',o.id,'applications',nx.id),{selected:true,workStatus:'info_pending'});toast('সুযোগ দেওয়া হয়েছে');drawAdmin()}catch(x){toast('হয়নি: '+x.code)}
  });
}

/* ================= রাউটার ================= */
function route(){renderWho();(location.hash==='#admin'?renderAdmin:renderPublic)()}
window.addEventListener('hashchange',route);
onAuthStateChanged(auth,u=>{user=u;isAdmin=!!u&&u.emailVerified&&ADMIN_EMAILS.includes((u.email||'').toLowerCase());route()});
</script>
